<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="balloonGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="70%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </radialGradient>
    <filter id="balloonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Fundo escuro sutil -->
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  <!-- Balão de Festa -->
  <path d="M 50 15 C 32 15 20 28 20 45 C 20 62 45 76 48 79 L 46 83 L 54 83 L 52 79 C 55 76 80 62 80 45 C 80 28 68 15 50 15 Z" fill="url(#balloonGradient)" filter="url(#balloonShadow)" />
  <!-- Brilho no topo -->
  <ellipse cx="38" cy="32" rx="8" ry="14" transform="rotate(-30 38 32)" fill="#ffffff" opacity="0.4" />
  <!-- Fita / Cordão -->
  <path d="M 50 83 Q 46 89 54 93 Q 48 97 50 100" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" />
</svg>
